[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "raptor"
version = "0.1.0"
description = "Recursive Abstractive Processing for Tree-Organized Retrieval"
readme = "README.md"
requires-python = ">=3.8"
license = {text = "MIT"}
dependencies = [
    "faiss-cpu",
    "numpy>=1.26.0",
    "openai>=1.24.0,<3.0.0",
    "scikit-learn",
    "sentence-transformers>=2.2.2",
    "tenacity>=8.2.3",
    "tiktoken>=0.5.2,<1.0.0",
    "torch",
    "transformers>=4.38.1",
    "umap-learn>=0.5.5",
    "urllib3>=1.26.6,<3.0.0",
]